<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar Practice</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <!-- Thanh điều hướng chính -->
    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
        <div class="menu-icon">☰</div>
    </nav>

    <!-- Khu vực nội dung kiểm thử -->
    <main class="content">
        <h1>Chào mừng bạn đến với MyWebsite</h1>
        <p>Hãy thử thay đổi kích thước cửa sổ trình duyệt hoặc bật chế độ xem thiết bị di động (F12) để kiểm tra thanh điều hướng responsive.</p>
    </main>

</body>
</html>
