<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh Responsive - RWD Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 class="title">Thư Viện Ảnh Responsive (RWD Gallery)</h2>
    <p class="subtitle">Thay đổi kích thước cửa sổ trình duyệt để kiểm tra số lượng ảnh hiển thị trên từng dòng.</p>

    <!-- Khung chứa danh sách ảnh Gallery -->
    <div class="gallery-container">

        <!-- Ảnh 1 -->
        <div class="responsive">
            <div class="gallery">
                <img src="https://picsum.photos/600/400?random=1" alt="Phong cảnh thiên nhiên 1">
                <div class="desc">Cảnh quan thiên nhiên rực rỡ - Hình 1</div>
            </div>
        </div>

        <!-- Ảnh 2 -->
        <div class="responsive">
            <div class="gallery">
                <img src="https://picsum.photos/600/400?random=2" alt="Phong cảnh thiên nhiên 2">
                <div class="desc">Rừng núi hùng vĩ bạt ngàn - Hình 2</div>
            </div>
        </div>

        <!-- Ảnh 3 -->
        <div class="responsive">
            <div class="gallery">
                <img src="https://picsum.photos/600/400?random=3" alt="Phong cảnh thiên nhiên 3">
                <div class="desc">Bình minh tuyệt đẹp trên biển - Hình 3</div>
            </div>
        </div>

        <!-- Ảnh 4 -->
        <div class="responsive">
            <div class="gallery">
                <img src="https://picsum.photos/600/400?random=4" alt="Phong cảnh thiên nhiên 4">
                <div class="desc">Thành phố lung linh về đêm - Hình 4</div>
            </div>
        </div>

    </div>

</body>
</html>
